[build-system]
requires = ["hatchling>=1.20.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "labelme"
description = "Image annotation with Python."
license = { text = "GPL-3.0-only" }
requires-python = ">=3.12"
authors = [{ name = "Kentaro Wada", email = "www.kentaro.wada@gmail.com" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "imgviz>=2.0.0",
  "loguru>=0.7",
  "matplotlib>=3.7",
  "natsort>=7.1.0",
  "numpy>=1.24",
  "onnxruntime>=1.23.2",
  "osam>=0.4.0",
  "pillow>=2.8",
  "pyside6>=6.8",
  "scipy>=1.8",
  "scikit-image>=0.21",
  "tifffile>=2024.1.30",
  "ruamel-yaml>=0.18",
]
dynamic = ["readme", "version"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'src="(?!https?://)([^"]+)"'
replacement = 'src="https://raw.githubusercontent.com/wkentaro/labelme/main/\1"'

[tool.hatch.version]
source = "vcs"

[dependency-groups]
dev = [
  "ipython",
  "mdformat-frontmatter>=2.0.10",
  "mdformat>=0.7",
  "pytest>=8.3.4",
  "pytest-cov>=7.1.0",
  "pytest-qt>=4.4.0",
  "pytest-xdist>=3.8.0",
  "ruff~=0.12.11",
  "taplo>=0.9.3",
  "twine>=6.1.0",
  "ty>=0.0.31",
  "types-pillow>=10.2.0.20240822",
  "typos>=1.45.0",
  "yamlfix>=1.19.1",
  "towncrier>=24.8",
  "gruff>=0.0.4",
]

[project.scripts]
labelme = "labelme.__main__:main"

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
title_format = "## {version} - {project_date}"
issue_format = "[#{issue}](https://github.com/wkentaro/labelme/pull/{issue})"
ignore = ["README.md"]
type = [
  { directory = "added", name = "Added", showcontent = true },
  { directory = "changed", name = "Changed", showcontent = true },
  { directory = "deprecated", name = "Deprecated", showcontent = true },
  { directory = "removed", name = "Removed", showcontent = true },
  { directory = "fixed", name = "Fixed", showcontent = true },
  { directory = "security", name = "Security", showcontent = true },
]

[tool.pytest.ini_options]
addopts = "-m 'not network'"
qt_api = "pyside6"
markers = [
  "gui: mark a test as a GUI test.",
  "network: mark a test that accesses an external network service.",
  "pixel_snapshot: mark a test that compares rendering against a stored pixel snapshot.",
]

[tool.gruff.lint]
select = ["GR002", "GR003", "GR004", "GR006"]

[tool.ruff.lint]
select = [
  "ANN",    # flake8-annotations
  "E",      # pycodestyle
  "F",      # pyflakes
  "I",      # isort
  "UP",     # pyupgrade
  "RUF022", # sorted __all__
  "B006",   # mutable argument defaults
  "RUF012", # mutable class attributes
  "B008",   # function calls in argument defaults
]
# UP040 wants PEP 695 `type X = ...`, but our Literal aliases are enumerated at
# runtime via typing.get_args(), which returns () for a lazy `type` alias.
ignore = ["UP040"]

[tool.ruff.lint.isort]
force-single-line = true
