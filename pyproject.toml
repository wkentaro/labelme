[build-system]
requires = ["hatchling>=1.20.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "labelme"
description = "Image annotation with Python."
license = { text = "GPL-3.0-only" }
requires-python = ">=3.12"
authors = [{ name = "Kentaro Wada", email = "www.kentaro.wada@gmail.com" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  # _model_manager.py patches gdown.cached_download internals.
  "gdown>=6.4,<7",
  "imgviz>=2.0.0",
  "loguru>=0.7",
  "matplotlib>=3.7",
  "natsort>=7.1.0",
  "numpy>=1.24",
  "onnxruntime>=1.23.2,<1.29",
  "osam>=0.10.2,<0.11",
  # WebGPU's runtime needs Apple Silicon and macOS 14 (Darwin 23) on Macs.
  "osam[webgpu]; sys_platform != 'darwin' or (platform_machine == 'arm64' and platform_release >= '23.0.0')",
  "pillow>=2.8",
  "pyside6>=6.8",
  "scipy>=1.8",
  "scikit-image>=0.21",
  "tifffile>=2024.1.30",
  "ruamel-yaml>=0.18",
]
dynamic = ["readme", "version"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'src="(?!https?://)([^"]+)"'
replacement = 'src="https://raw.githubusercontent.com/wkentaro/labelme/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/wkentaro/labelme/blob/main/\1)'

[tool.hatch.version]
source = "vcs"

# Generated datasets and README images make up most of examples/; the
# scripts and their annotated inputs stay, since tests/unit/examples runs them.
[tool.hatch.build.targets.sdist]
exclude = ["examples/*/data_dataset_*", "examples/*/.readme"]

[dependency-groups]
dev = [
  "ipython",
  "mdformat>=0.7",
  "pytest>=8.3.4",
  "pytest-cov>=7.1.0",
  "pytest-qt>=4.4.0",
  "pytest-xdist>=3.8.0",
  "ruff~=0.12.11",
  "taplo>=0.9.3",
  "ty>=0.0.31",
  "typos>=1.45.0",
  "yamlfix>=1.19.1",
  "towncrier>=24.8",
  "gruff>=0.2.5",
  "packaging>=26.1",
]

[project.scripts]
labelme = "labelme.__main__:main"

[tool.uv]
# The last Intel/macOS 13 runtime wheels cover Python 3.12 and 3.13.
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'x86_64' and python_version < '3.14'",
  "sys_platform == 'darwin' and platform_machine == 'arm64' and platform_release == '22.0.0' and python_version < '3.14'",
]

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
title_format = "## {version} - {project_date}"
issue_format = "[#{issue}](https://github.com/wkentaro/labelme/pull/{issue})"
ignore = ["README.md"]
type = [
  { directory = "added", name = "Added", showcontent = true },
  { directory = "changed", name = "Changed", showcontent = true },
  { directory = "deprecated", name = "Deprecated", showcontent = true },
  { directory = "removed", name = "Removed", showcontent = true },
  { directory = "fixed", name = "Fixed", showcontent = true },
  { directory = "security", name = "Security", showcontent = true },
]

[tool.pytest.ini_options]
# Show blocked GUI and worker stacks before CI reaches its job timeout.
faulthandler_timeout = 60
addopts = "-m 'not network'"
filterwarnings = [
  "error::ResourceWarning",
  "error::pytest.PytestUnraisableExceptionWarning",
]
qt_api = "pyside6"
markers = [
  "network: mark a test that accesses an external network service.",
  "pixel_snapshot: mark a test that compares rendering against a stored pixel snapshot.",
]

[tool.gruff.lint]
select = ["GR"]
# GR013 enforces the stricter form of GR001.
ignore = ["GR001"]

[tool.ruff.lint]
select = [
  "ANN",     # flake8-annotations
  "E",       # pycodestyle
  "F",       # pyflakes
  "I",       # isort
  "UP",      # pyupgrade
  "RUF022",  # sorted __all__
  "B006",    # mutable argument defaults
  "RUF012",  # mutable class attributes
  "B008",    # function calls in argument defaults
  "ARG",     # unused arguments
  "FBT",     # boolean traps
  "PLC0415", # import outside top level
  "PLR2004", # magic value comparisons
]
# Keep ruff from flagging gruff's GR noqa codes as unknown.
external = ["GR"]
# UP040 wants PEP 695 `type X = ...`, but our Literal aliases are enumerated at
# runtime via typing.get_args(), which returns () for a lazy `type` alias.
ignore = ["UP040"]

[tool.ruff.lint.per-file-ignores]
# Literal expected values are the substance of an assertion, not a magic value.
"tests/**" = ["PLR2004"]

[tool.ruff.lint.isort]
force-single-line = true
