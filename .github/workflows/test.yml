---
name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
# Nine GUI cells per push are too expensive to keep running for superseded
# commits. github.ref is unique per pull request (refs/pull/N/merge) even for
# fork branches that share a name, and the event condition keeps main pushes
# and workflow_call runs uncancelled, so only obsolete PR runs are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - shell: bash
        run: |
          make setup
      - uses: awalsh128/cache-apt-pkgs-action@v1
        if: matrix.os == 'ubuntu-latest'
        with:
          packages: xvfb libegl1 libxkbcommon0 libxcb-cursor0 libgl1
          version: 1.0
      # The COCO exporter tests skip themselves without pycocotools, so it has
      # to be present before pytest runs. The pip install survives the inexact
      # sync that uv run performs.
      - name: Install optional example dependencies
        shell: bash
        if: matrix.os != 'windows-latest'
        run: |
          uv pip install cython pycocotools
      # Pixel snapshots skip themselves off Linux (tests/e2e/conftest.py), so
      # one plain invocation runs the right set everywhere.
      - name: Test
        shell: bash
        env:
          MPLBACKEND: agg
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a make test
          else
            make test
          fi
      - name: Run examples
        shell: bash
        if: matrix.os != 'windows-latest'
        env:
          MPLBACKEND: agg
        run: |
          labelme --help
          labelme --version
          # examples/ must stay self-contained: no labelme imports (#2231)
          ! grep -rnE "import labelme|from labelme" examples/
          example_tmp=$(mktemp -d)
          trap 'rm -rf "$example_tmp"' EXIT
          examples/tutorial/export_json.py tests/data/annotated_with_data/apc2016_obj3.json -o "$example_tmp/tutorial"
          python examples/tutorial/load_label_png.py "$example_tmp/tutorial/label.png" "$example_tmp/tutorial/label_names.txt"
          examples/semantic_segmentation/labelme2voc.py tests/data/annotated "$example_tmp/semantic" --labels tests/data/labels.txt
          examples/instance_segmentation/labelme2voc.py tests/data/annotated "$example_tmp/instance" --labels tests/data/labels.txt
          examples/video_annotation/labelme2voc.py tests/data/annotated "$example_tmp/video" --labels tests/data/labels.txt
          uv pip install lxml  # for bbox_detection/labelme2voc.py
          examples/bbox_detection/labelme2voc.py tests/data/annotated "$example_tmp/bbox" --labels tests/data/labels.txt
          grep -q '<object>' "$example_tmp/bbox/Annotations/2011_000003.xml"
          examples/instance_segmentation/labelme2coco.py tests/data/annotated "$example_tmp/coco" --labels tests/data/labels.txt
  artifact-install-smoke:
    runs-on: ${{ matrix.os }}
    # Each leg does a cold build plus two isolated installs (PySide6,
    # onnxruntime, and friends), heavier than a plain dependency sync, so it
    # gets more headroom against cold-cache runners.
    timeout-minutes: 20
    strategy:
      # fail-fast would cancel the sibling legs before they report, and the one
      # excluded combination below is exactly the kind of platform-specific
      # break this job exists to find, so every leg runs to completion.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Smoke-test installed artifacts
        uses: ./.github/actions/artifact-install-smoke
  network-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          activate-environment: true
      - shell: bash
        run: |
          make setup
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: xvfb libegl1 libxkbcommon0 libxcb-cursor0 libgl1
          version: 1.0
      - name: Test real model download
        shell: bash
        env:
          MPLBACKEND: agg
        run: |-
          xvfb-run -a make test PYTEST_ARGS="-m network --numprocesses=1"
