---
name: Release
on:
  push:
    tags: [v*]
jobs:
  test:
    uses: ./.github/workflows/test.yml
  release:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: extractions/setup-just@4a174aa1487e2bcb3f86a8fe24a05361a4f4fff1
        with:
          just-version: 1.58.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
      - run: just check_translate
      - name: Validate release artifacts
        uses: ./.github/actions/artifact-install-smoke
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
        with:
          skip-existing: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          version=${GITHUB_REF_NAME#v}
          awk -v heading="## $version " 'index($0, heading) == 1 {found = 1; next}
            found && /^## / {exit} found' CHANGELOG.md > notes.md
          test -s notes.md
          case $version in *[a-z]*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes-file notes.md $prerelease
