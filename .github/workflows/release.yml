---
name: Release
on:
  push:
    tags: [v*]
jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libegl1 libxkbcommon0 libxcb-cursor0 libgl1
          version: 1.0
      - run: make check_translate
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section found for $version" >&2
            exit 1
          fi
      - name: Build wheel and source distribution
        run: uv build
      - name: Validate release artifacts
        uses: ./.github/actions/artifact-install-smoke
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file
          release-notes.md
